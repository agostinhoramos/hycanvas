# HyCanvas behind nginx at https://cr.newgus.com/hycanvas/
# Upstream: docker compose publishes host port 1669 -> container :8005
#
# In http {} (once per nginx):
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

# Redirect bare path to trailing slash
location = /hycanvas {
    return 301 /hycanvas/;
}

location /hycanvas/ {
    proxy_pass http://192.168.1.67:1669/;

    client_max_body_size 16m;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Prefix /hycanvas;

    proxy_redirect off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}